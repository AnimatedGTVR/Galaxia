[package]
name = "galaxia-comp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
galaxia-ipc = { version = "0.0.1", path = "../galaxia-ipc" }
galaxia-theme = { path = "../galaxia-theme" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.18.1"
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
