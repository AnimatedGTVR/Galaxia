# Copy to ~/.config/galaxia/theme.toml and change what you like.
# Every line is optional. Alt+Shift+R reloads it without restarting.

accent          = "#8c73ff"    # focused window border
border_inactive = "#ffffff14"  # other windows (#rrggbbaa)
background      = "#0a0817"    # base of the built-in space background
# wallpaper     = "~/Pictures/wallpaper.jpg"   # png, jpeg or webp
#                 unset = Galaxia's default (Webb "Cosmic Cliffs"), "none" = space backdrop
shadow          = "#0000008c"

corner_radius = 14
border_width  = 2
gap           = 12
shadow_size   = 28

glass_blur    = 24
glass_opacity = 0.6

anim_ms = 220   # 0 turns animations off
